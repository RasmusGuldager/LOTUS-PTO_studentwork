# Named camera configuration presets
camera_configs:
  prototypeLongExp:
    <<: *default_camera_settings
    lighting_settings:
      <<: *default_lighting_settings
      exposure_time: 25000.0
      gain: 1.0
    auto_settings:
      <<: *default_auto_settings
      auto_exposure: "off"
      auto_gain: "off"
  prototypeShortExp:
    <<: *default_camera_settings
    lighting_settings:
      <<: *default_lighting_settings
      exposure_time: 12500.0
      gain: 1.0
    auto_settings:
      <<: *default_auto_settings
      auto_exposure: "off"
      auto_gain: "off"
  action:
    <<: *default_camera_settings
    lighting_settings:
      <<: *default_lighting_settings
      exposure_time: 3500.0
    auto_settings:
      <<: *default_auto_settings
      auto_exposure: "off"
      auto_gain: "off"
      auto_gain_upper_limit: 18
  balance:
    <<: *default_camera_settings
    lighting_settings:
      exposure_time: 15000.0
      gain: 3.5
    auto_settings:
      <<: *default_auto_settings
      auto_exposure: "off"
      auto_gain: "off"
    video_settings:
      <<: *default_video_settings
      acquisition_fps: 24
  longExposure:
    <<: *default_camera_settings
    lighting_settings:
      <<: *default_lighting_settings
      exposure_time: 75000.0
      gain: 1.0
    auto_settings:
      <<: *default_auto_settings
      auto_brightness_target: 0.65
      auto_exposure: "off"
      auto_gain: "off"
    video_settings:
      <<: *default_video_settings
      acquisition_fps: 10

# Named lighting configuration presets
light_configs:
  bright:
    <<: *default_light_settings
    light.1: 255
    light.2: 255
  dim: 
    <<: *default_light_settings
    light.1: 90
    light.2: 90
