DEFAULT: 
  camera_config: &default_camera_settings # Default settings that are inherited by all others
    image_settings:
      width: 3548                   # Maks er 3548
      height: 3552                  # Maks er 3552
      offset_x: 0 
      offset_y: 0
      pixel_format: "rgb8" #Debayered using Baslers layer
    video_settings:
      enable_acquisition: "on"
      acquisition_fps: 30
    lighting_settings:
      exposure_time: 15000.0        # mikrosekunder 
      gain: 1.0
    auto_settings:
      auto_brightness_target: 0.5   # Mellem 0.0 og 1.0
      auto_function: "min_gain"     # "min_gain", eller "min_exposure"
      auto_exposure: "continuous"   # off, once, continuous
      auto_exposure_lower_limit: 1.0
      auto_exposure_upper_limit: 100000.0
      auto_gain: "continuous"       # off, once, continuous
      auto_gain_lower_limit: 0
      auto_gain_upper_limit: 24
  light_config: &default_light_settings
    light.1: 128 # Strength in 8bit values (0-255)
    light.2: 128 # Strength in 8bit values (0-255)
    light.3: 128 # Strength in 8bit values (0-255

# named hardware cofigurations for individiual rigs
setups:
  usb_cam:
    camera:
      ip: null
      settings: *default_camera_settings
  rig1: 
    camera:
      ip: 192.168.10.11
      serial: 123123123
      settings: *default_camera_settings
    sbc:
      ip: 127.0.0.101
      port: 5000
    light:
      settings: *default_light_settings
  rig2:
    camera:
      ip: 192.168.10.12
      serial: 123124673
      settings: *default_camera_settings
    sbc:
      ip: 192.168.10.102
      port: 5000
    light:
      settings: *default_light_settings
  rig3:
    camera:
      ip: 192.168.10.13
      serial: 122487313
      settings: *default_camera_settings
    sbc:
      ip: 192.168.10.103
      port: 5000
    light:
      settings: *default_light_settings

# Named camera configuration presets
camera_configs:
  action:
    <<: *default_camera_settings
    lighting_settings:
      exposure_time: 3500.0
    auto_settings:
      auto_exposure: "off"
      auto_gain: "continous"
      auto_gain_upper_limit: 18
  balance:
    <<: *default_camera_settings
    lighting_settings:
      exposure_time: 15000.0
      gain: 3.5
    auto_settings:
      auto_exposure: "once"
      auto_gain: "off"
    video_settings:
      acquisition_fps: 24
  longExposure:
    <<: *default_camera_settings
    lighting_settings:
      exposure_time: 750000.0
      gain: 1.0
    auto_settings:
      auto_brightness_target: 0.65
      auto_exposure: "off"
      auto_gain: "off"
    video_settings:
      acquisition_fps: 10

# Named lighting configuration presets
light_configs:
  bright:
    <<: *default_light_settings
    light.1: 255
    light.2: 255
  dim: 
    <<: *default_light_settings
    light.1: 80
    light.2: 80
